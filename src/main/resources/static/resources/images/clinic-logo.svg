<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80" viewBox="0 0 600 160" role="img" aria-labelledby="title">
  <title id="title">Clínica Veterinaria</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0d6efd"/>
      <stop offset="1" stop-color="#29b6f6"/>
    </linearGradient>
  </defs>
  <g transform="translate(10,10)">
    <!-- simple heart + cross icon with dog/cat silhouettes simplified -->
    <g transform="translate(0,0) scale(1)">
      <path d="M60 20 C40 -10, 0 -10, 0 20 C0 60, 60 80, 60 120 C60 80, 120 60, 120 20 C120 -10, 80 -10, 60 20 Z" fill="url(#g)" opacity="0.95"/>
      <rect x="45" y="45" width="30" height="12" rx="2" fill="#fff"/>
      <rect x="51" y="39" width="18" height="30" rx="2" fill="#fff"/>
    </g>

    <!-- text -->
    <g transform="translate(150,30)">
      <text x="0" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#0b71d0">Clínica</text>
      <text x="0" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#0566b3">Veterinaria</text>
    </g>
  </g>
</svg>
