<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <div class="owners-page">
    <div class="owners-top">
      <h2 th:text="# {owners}">Owners</h2>
      <div class="owners-search">
        <input id="owner-search" class="form-control" placeholder="Buscar..." />
        <a th:href="@{/owners/new}" class="btn btn-primary ms-2">+ Agregar Propietario</a>
      </div>
    </div>

    <div class="row">
      <div class="col-md-7">
        <table id="owners" class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}" style="width: 150px;">Name</th>
        <th th:text="#{address}" style="width: 200px;">Address</th>
        <th th:text="#{city}">City</th>
        <th th:text="#{telephone}" style="width: 120px">Telephone</th>
        <th th:text="#{pets}">Pets</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="owner : ${listOwners}">
        <td>
          <a th:href="@{/owners/__${owner.id}__}" th:attr="data-owner-id=${owner.id}" class="owner-link" th:text="${owner.firstName + ' ' + owner.lastName}"></a>
        </td>
        <td th:text="${owner.address}" />
        <td th:text="${owner.city}" />
        <td th:text="${owner.telephone}" />
        <td><span th:text="${#strings.listJoin(owner.pets, ', ')}" /></td>
      </tr>
    </tbody>
      </table>
      <div th:if="${totalPages > 1}">
    <span th:text="#{pages}">Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{'/owners?page=' + ${i}}">[[${i}]]</a>
      <span th:unless="${currentPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/owners?page=1'}" th:title="#{first}" class="fa fa-fast-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{first}" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/owners?page=__${currentPage - 1}__'}" th:title="#{previous}"
        class="fa fa-step-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{previous}" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/owners?page=__${currentPage + 1}__'}" th:title="#{next}"
        class="fa fa-step-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{next}" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/owners?page=__${totalPages}__'}" th:title="#{last}"
        class="fa fa-fast-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{last}" class="fa fa-fast-forward"></span>
    </span>
        </div>
      </div>

      <div class="col-md-5">
        <div id="owner-details-container" th:insert="~{owners/ownerDetailsFragment :: ownerDetailsFragment}">
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      function loadOwner(id) {
        fetch('/owners/' + id + '/json')
          .then(function (r) { if (!r.ok) throw new Error('Not found'); return r.json(); })
          .then(function (owner) {
            document.getElementById('od-name').textContent = owner.firstName + ' ' + owner.lastName;
            document.getElementById('od-address').textContent = owner.address || '';
            document.getElementById('od-telephone').textContent = owner.telephone || '';
            document.getElementById('od-email').textContent = owner.email || '';
            var petsEl = document.getElementById('od-pets');
            petsEl.innerHTML = '';
            if (owner.pets) {
              owner.pets.forEach(function (p) {
                var li = document.createElement('li');
                li.className = 'list-group-item';
                li.textContent = p.name + ' (' + (p.type ? p.type.name : '') + ')';
                petsEl.appendChild(li);
              });
            }
            var visitsEl = document.getElementById('od-visits');
            visitsEl.innerHTML = '';
            if (owner.pets) {
              owner.pets.forEach(function (p) {
                if (p.visits) {
                  p.visits.forEach(function (v) {
                    var li = document.createElement('li');
                    li.className = 'list-group-item';
                    li.textContent = (v.date ? v.date : '') + ' - ' + (v.description || '');
                    visitsEl.appendChild(li);
                  });
                }
              });
            }
          })
          .catch(function (e) {
            console.warn('Owner load failed', e);
          });
      }

      document.querySelectorAll('.owner-link').forEach(function (el) {
        el.addEventListener('click', function (ev) {
          // allow normal navigation with ctrl/cmd click
          if (ev.metaKey || ev.ctrlKey) return;
          ev.preventDefault();
          var id = el.getAttribute('data-owner-id');
          if (id) loadOwner(id);
        });
      });
    });
  </script>
</body>

</html>
